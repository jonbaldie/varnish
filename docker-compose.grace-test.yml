services:
  varnish:
    build: .
    image: jonbaldie/varnish
    ports:
      - "8083:80"
    volumes:
      - ./default.vcl:/etc/varnish/default.vcl:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  web:
    build:
      context: ./test/hostile-backend
    environment:
      PORT: "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/ready"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 1s
    restart: unless-stopped
