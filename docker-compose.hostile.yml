services:
  hostile-backend:
    build:
      context: ./test/hostile-backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
          pids: 100
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 1s

  varnish-hostile:
    build: .
    image: ${VARNISH_IMAGE:-jonbaldie/varnish}
    ports:
      - "127.0.0.1:8081:80"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
          pids: 512
    environment:
      VARNISH_BACKEND_HOST: hostile-backend
      VARNISH_BACKEND_PORT: "8080"
      VARNISH_BACKEND_PROBE_PATH: /ready
    volumes:
      - ${HOSTILE_CACHE_POLICY_PATH:-./cache-policy.vcl}:/etc/varnish/cache-policy.vcl:ro
    depends_on:
      hostile-backend:
        condition: service_healthy
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
