services:
  varnish:
    build: .
    image: jonbaldie/varnish
    ports:
      - "80:80"
    environment:
      VARNISH_BACKEND_HOST: web
      VARNISH_BACKEND_PORT: "80"
      VARNISH_BACKEND_PROBE_PATH: /
    volumes:
      - ./cache-policy.vcl:/etc/varnish/cache-policy.vcl:ro
    depends_on:
      - web
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  web:
    image: nginx:alpine
    restart: unless-stopped
