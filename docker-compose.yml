services:
  varnish:
    build: .
    image: ${VARNISH_IMAGE:-jonbaldie/varnish}
    ports:
      - "127.0.0.1:80:80"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
          pids: 512
    environment:
      VARNISH_BACKEND_HOST: web
      VARNISH_BACKEND_PORT: "80"
      VARNISH_BACKEND_PROBE_PATH: /
    volumes:
      - ./cache-policy.vcl:/etc/varnish/cache-policy.vcl:ro
    depends_on:
      - web
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  web:
    image: nginx:alpine
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
          pids: 100
    restart: unless-stopped
