services:
  varnish:
    build: .
    image: jonbaldie/varnish
    ports:
      - "${HOSTILE_SCENARIO_PORT:?HOSTILE_SCENARIO_PORT is required}:80"
    environment:
      VARNISH_BACKEND_HOST: web
      VARNISH_BACKEND_PORT: "80"
      VARNISH_BACKEND_PROBE_PATH: /
    volumes:
      - ./cache-policy.vcl:/etc/varnish/cache-policy.vcl:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - backend

  web:
    build:
      context: ./test/hostile-backend
    environment:
      PORT: "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/ready"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 1s
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    driver: bridge
